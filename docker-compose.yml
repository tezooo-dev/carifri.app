version: '3.9'

services:
  app:
    build: .
    container_name: freightlink-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      # Persist SQLite database + backups outside the container
      - ./data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: freightlink-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      # SSL certificates — use Let's Encrypt / certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
